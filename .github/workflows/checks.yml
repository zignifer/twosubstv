name: Проверки приложения

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Проверка Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt"
      - name: Проверки адаптера
        run: npm ci --ignore-scripts && npm test
      - name: Проверки публичных файлов
        run: node tools/check-publication.mjs
      - name: Проверки установщика
        shell: pwsh
        run: ./tools/test-install.ps1
      - name: Сборка, JUnit и Android lint
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug
